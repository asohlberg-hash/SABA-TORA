<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אוצר דברי התורה של סבא שאול</title>
    <!-- טעינת Tailwind CSS לעיצוב מודרני ומותאם למובייל ולמחשב -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- טעינת גופנים עבריים מ-Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- טעינת אייקונים מ-Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],
                        serif: ['David Libre', 'serif'],
                    },
                    colors: {
                        parchment: {
                            50: '#fdfbf7',
                            100: '#f8f3e8',
                            200: '#efe4ce',
                            300: '#e2ceaa',
                            800: '#5c4a2e',
                            900: '#3d301d',
                        },
                        royal: {
                            800: '#1e3a5f',
                            900: '#132640',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* עיצוב מותאם אישית לפס הגלילה ולטקסט תורני */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f8f3e8;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4c19c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #b89f72;
        }
        .torah-content {
            line-height: 1.85;
            font-size: 1.125rem;
        }
        .torah-content p {
            margin-bottom: 1rem;
        }
        /* אנימציות כניסה ועיצוב כרטיסיות ב-CSS טהור */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .lesson-card-animate {
            animation: fadeInUp 0.25s ease-out forwards;
        }
        .fav-star-active {
            color: #f59e0b;
            fill: #f59e0b;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
        }
    </style>
</head>
<body class="bg-parchment-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- כותרת עליונה (Header) -->
    <header class="bg-gradient-to-l from-royal-900 via-royal-800 to-royal-900 text-white shadow-lg sticky top-0 z-30 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="bg-amber-400/20 p-2.5 rounded-xl border border-amber-300/30">
                        <i data-lucide="book-open-check" class="w-7 h-7 text-amber-300"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-amber-50">אוצר דברי התורה של סבא שאול</h1>
                        <p class="text-xs sm:text-sm text-amber-200/80">ארכיון שיעורים ודפים לפרשת השבוע מתיבת המייל (משפחת סולברג)</p>
                    </div>
                </div>

                <!-- סטטיסטיקה מהירה וכפתור הוספה -->
                <div class="flex flex-wrap items-center gap-2 sm:gap-3 self-end md:self-auto">
                    <div class="bg-white/10 backdrop-blur-sm px-3 py-1.5 rounded-lg text-xs sm:text-sm border border-white/10">
                        <span id="total-count" class="font-bold text-amber-300">0</span> דברי תורה
                    </div>
                    <button id="sync-site-btn" onclick="syncFromHatulSite()" class="flex items-center gap-1.5 bg-emerald-500 hover:bg-emerald-400 text-royal-950 font-bold px-3.5 py-2 rounded-xl text-xs sm:text-sm transition shadow-sm cursor-pointer" title="שאיבת כל דברי התורה מתש״פ ואילך מהאתר tora.hatul.info">
                        <i data-lucide="refresh-cw" id="sync-site-icon" class="w-4 h-4"></i>
                        <span>סנכרן מאתר תורה</span>
                    </button>
                    <button onclick="exportArchiveJSON()" class="flex items-center gap-1.5 bg-white/15 hover:bg-white/25 text-amber-100 font-medium px-3 py-2 rounded-xl text-xs sm:text-sm transition border border-white/15 cursor-pointer" title="הורד קובץ גיבוי לשיתוף">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">ייצוא</span>
                    </button>
                    <label class="flex items-center gap-1.5 bg-white/15 hover:bg-white/25 text-amber-100 font-medium px-3 py-2 rounded-xl text-xs sm:text-sm transition border border-white/15 cursor-pointer" title="טען קובץ גיבוי JSON">
                        <i data-lucide="upload" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">ייבוא</span>
                        <input type="file" accept=".json" onchange="importArchiveJSON(event)" class="hidden">
                    </label>
                    <button onclick="openAddModal()" class="flex items-center gap-1.5 bg-amber-500 hover:bg-amber-400 text-royal-950 font-semibold px-3.5 py-2 rounded-xl text-sm transition shadow-sm cursor-pointer">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span>הוסף ידנית</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- סרגל סינון וחיפוש -->
    <section class="bg-parchment-100 border-b border-parchment-200 py-5 px-4 sm:px-6 lg:px-8 shadow-sm no-print">
        <div class="max-w-7xl mx-auto space-y-4">
            <!-- שורת חיפוש מרכזית בולטת לפי פרשה, שנה או מילת מפתח -->
            <div class="bg-white p-2 rounded-2xl border-2 border-royal-800/20 focus-within:border-royal-800 shadow-sm transition-all">
                <div class="relative flex items-center">
                    <i data-lucide="search" class="w-5 h-5 text-royal-800 mr-3 shrink-0"></i>
                    <input type="text" id="search-input" 
                           placeholder="חיפוש מהיר לפי פרשה (למשל: וישב, ראה), שנה (תשפ״ד, תשפ״ה) או מילת מפתח (רש״י, הרב זקס, שבת, ירושלים)..." 
                           class="w-full px-3 py-2 bg-transparent text-base text-slate-800 placeholder:text-slate-400 focus:outline-none">
                    <button id="clear-search-btn" onclick="clearSearchInput()" class="hidden p-1.5 ml-1 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition cursor-pointer" title="נקה חיפוש">
                        <i data-lucide="x-circle" class="w-5 h-5"></i>
                    </button>
                </div>
                    <button type="button" onclick="quickSearch('תשפ״ה')" class="px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-900 border border-amber-200 hover:bg-amber-100 transition cursor-pointer">תשפ״ה</button>
                    <button type="button" onclick="quickSearch('תשפ״ד')" class="px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-900 border border-amber-200 hover:bg-amber-100 transition cursor-pointer">תשפ״ד</button>
                    <button type="button" onclick="quickSearch('תשפ״ג')" class="px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-900 border border-amber-200 hover:bg-amber-100 transition cursor-pointer">תשפ״ג</button>
                    <button type="button" onclick="quickSearch('תשפ״ב')" class="px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-900 border border-amber-200 hover:bg-amber-100 transition cursor-pointer">תשפ״ב</button>
                    <button type="button" onclick="quickSearch('תשפ״א')" class="px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-900 border border-amber-200 hover:bg-amber-100 transition cursor-pointer">תשפ״א</button>
                    <button type="button" onclick="quickSearch('תש״פ')" class="px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-900 border border-amber-200 hover:bg-amber-100 transition cursor-pointer">תש״פ</button>
                    <button type="button" onclick="quickSearch('רמב״ן')" class="px-2.5 py-0.5 rounded-full bg-parchment-100 text-parchment-900 border border-parchment-300 hover:bg-parchment-200 transition cursor-pointer">רמב״ן</button>
                    <button type="button" onclick="quickSearch('הרב זקס')" class="px-2.5 py-0.5 rounded-full bg-parchment-100 text-parchment-900 border border-parchment-300 hover:bg-parchment-200 transition cursor-pointer">הרב זקס</button>
                    <button type="button" onclick="quickSearch('תוספת ברכה')" class="px-2.5 py-0.5 rounded-full bg-parchment-100 text-parchment-900 border border-parchment-300 hover:bg-parchment-200 transition cursor-pointer">תוספת ברכה</button>
                    <button type="button" onclick="quickSearch('הרב זוין')" class="px-2.5 py-0.5 rounded-full bg-parchment-100 text-parchment-900 border border-parchment-300 hover:bg-parchment-200 transition cursor-pointer">הרב זוין</button>
                    <button type="button" onclick="quickSearch('ירושלים')" class="px-2.5 py-0.5 rounded-full bg-parchment-100 text-parchment-900 border border-parchment-300 hover:bg-parchment-200 transition cursor-pointer">ירושלים</button>
                </div>
            </div>

            <!-- שורת סינון משנית לפי שנה ופרשה -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- סינון לפי שנה עברית -->
                <div class="relative">
                    <select id="year-filter" class="w-full px-3.5 py-2.5 bg-white border border-parchment-300 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-royal-800/30 focus:border-royal-800 appearance-none cursor-pointer">
                        <option value="all">כל השנים העבריות</option>
                    </select>
                    <i data-lucide="calendar" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                </div>

                <!-- סינון לפי פרשה ספציפית -->
                <div class="relative">
                    <select id="parasha-filter" class="w-full px-3.5 py-2.5 bg-white border border-parchment-300 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-royal-800/30 focus:border-royal-800 appearance-none cursor-pointer">
                        <option value="all">כל הפרשות והמועדים</option>
                    </select>
                    <i data-lucide="scroll-text" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                </div>
            </div>

            <!-- כפתורי סינון מהיר לפי חומשים -->
            <div class="flex flex-wrap items-center gap-2 pt-1" id="chumash-tabs">
                <button data-chumash="all" class="chumash-btn active px-4 py-1.5 rounded-full text-sm font-semibold transition cursor-pointer bg-royal-800 text-white shadow-sm">
                    הכל
                </button>
                <button data-chumash="בראשית" class="chumash-btn px-4 py-1.5 rounded-full text-sm font-medium transition cursor-pointer bg-white text-slate-700 hover:bg-parchment-200 border border-parchment-300">
                    חומש בראשית
                </button>
                <button data-chumash="שמות" class="chumash-btn px-4 py-1.5 rounded-full text-sm font-medium transition cursor-pointer bg-white text-slate-700 hover:bg-parchment-200 border border-parchment-300">
                    חומש שמות
                </button>
                <button data-chumash="ויקרא" class="chumash-btn px-4 py-1.5 rounded-full text-sm font-medium transition cursor-pointer bg-white text-slate-700 hover:bg-parchment-200 border border-parchment-300">
                    חומש ויקרא
                </button>
                <button data-chumash="במדבר" class="chumash-btn px-4 py-1.5 rounded-full text-sm font-medium transition cursor-pointer bg-white text-slate-700 hover:bg-parchment-200 border border-parchment-300">
                    חומש במדבר
                </button>
                <button data-chumash="דברים" class="chumash-btn px-4 py-1.5 rounded-full text-sm font-medium transition cursor-pointer bg-white text-slate-700 hover:bg-parchment-200 border border-parchment-300">
                    חומש דברים
                </button>
                <button data-chumash="מועדים" class="chumash-btn px-4 py-1.5 rounded-full text-sm font-medium transition cursor-pointer bg-white text-slate-700 hover:bg-parchment-200 border border-parchment-300">
                    חגים ומועדים
                </button>
                <button id="favorites-toggle-btn" onclick="toggleFavoritesFilter()" class="px-4 py-1.5 rounded-full text-sm font-medium transition cursor-pointer bg-white text-amber-800 hover:bg-amber-50 border border-amber-300 flex items-center gap-1.5 mr-auto">
                    <i data-lucide="star" class="w-3.5 h-3.5 text-amber-500"></i>
                    <span>מועדפים (<span id="fav-count">0</span>)</span>
                </button>
            </div>
        </div>
    </section>

    <!-- תוכן ראשי -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 no-print">
        <!-- שורת מידע על התוצאות ומיון -->
        <div class="flex flex-wrap items-center justify-between gap-2 mb-6">
            <p class="text-sm text-slate-600">
                מציג <span id="filtered-count" class="font-bold text-royal-800">0</span> דברי תורה
                <span id="active-filters-label" class="text-slate-500"></span>
            </p>
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-500">מיון לפי:</span>
                <select id="sort-select" class="bg-white border border-parchment-300 rounded-lg px-2.5 py-1 text-xs font-medium text-slate-700 focus:outline-none">
                    <option value="parasha-order">סדר הפרשות בתורה</option>
                    <option value="date-desc">תאריך שליחה (מהחדש לישן)</option>
                    <option value="date-asc">תאריך שליחה (מהישן לחדש)</option>
                </select>
                <button onclick="resetFilters()" id="reset-btn" class="hidden text-xs text-royal-800 hover:underline font-medium mr-2 cursor-pointer">
                    נקה סינון
                </button>
            </div>
        </div>

        <!-- רשת הכרטיסיות של דברי התורה -->
        <div id="lessons-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- הכרטיסיות יוזרקו לכאן דינמית -->
        </div>

        <!-- הודעה כשאין תוצאות -->
        <div id="empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-parchment-200 shadow-sm">
            <div class="bg-parchment-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="book-x" class="w-8 h-8 text-parchment-800"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-1">לא נמצאו דברי תורה תואמים</h3>
            <p class="text-sm text-slate-500 mb-4">נסה לשנות את מילות החיפוש או לנקות את המסננים שנבחרו.</p>
            <button onclick="resetFilters()" class="bg-royal-800 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-royal-900 transition cursor-pointer">
                הצג את כל דברי התורה
            </button>
        </div>
    </main>

    <!-- מודאל קריאת דבר תורה מלא -->
    <div id="reader-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
        <div class="bg-parchment-50 w-full max-w-3xl rounded-2xl shadow-2xl border border-parchment-300 overflow-hidden flex flex-col max-h-[92vh]">
            <!-- כותרת המודאל -->
            <div class="bg-royal-900 text-white px-5 py-4 flex items-start justify-between gap-4 no-print">
                <div>
                    <div class="flex flex-wrap items-center gap-2 mb-1.5">
                        <span id="modal-chumash" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-400 text-royal-950"></span>
                        <span id="modal-parasha" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-white/15 text-amber-100"></span>
                        <span id="modal-year" class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-white/10 text-slate-200"></span>
                    </div>
                    <h2 id="modal-title" class="text-xl sm:text-2xl font-bold font-serif text-amber-50"></h2>
                </div>
                <button onclick="closeReaderModal()" class="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white transition cursor-pointer" title="סגור">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- סרגל כלים לקריאה -->
            <div class="bg-parchment-100 px-5 py-2.5 border-b border-parchment-200 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-600 no-print">
                <div class="flex items-center gap-4">
                    <span class="flex items-center gap-1"><i data-lucide="user" class="w-3.5 h-3.5 text-parchment-800"></i> <span id="modal-sender"></span></span>
                    <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5 text-parchment-800"></i> <span id="modal-date"></span></span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="changeFontSize(-1)" class="px-2 py-1 bg-white border border-parchment-300 rounded hover:bg-parchment-200 font-bold cursor-pointer" title="הקטן גופן">א-</button>
                    <button onclick="changeFontSize(1)" class="px-2 py-1 bg-white border border-parchment-300 rounded hover:bg-parchment-200 font-bold cursor-pointer" title="הגדל גופן">א+</button>
                    <button onclick="copyLessonText()" class="flex items-center gap-1 px-2.5 py-1 bg-white border border-parchment-300 rounded hover:bg-parchment-200 font-medium cursor-pointer">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i> העתק
                    </button>
                    <button onclick="window.print()" class="flex items-center gap-1 px-2.5 py-1 bg-royal-800 text-white rounded hover:bg-royal-900 font-medium cursor-pointer">
                        <i data-lucide="printer" class="w-3.5 h-3.5"></i> הדפס לשבת
                    </button>
                </div>
            </div>

            <!-- גוף הטקסט של דבר התורה -->
            <div id="modal-body-container" class="p-6 sm:p-8 overflow-y-auto flex-1 bg-white">
                <div id="modal-verse" class="mb-5 p-4 bg-parchment-100/80 border-r-4 border-amber-500 rounded-l-xl font-serif text-lg font-bold text-royal-900"></div>
                <div id="modal-content" class="torah-content text-slate-800 space-y-4 font-serif text-lg"></div>
            </div>
        </div>
    </div>

    <!-- מודאל להוספת דבר תורה חדש מהמייל -->
    <div id="add-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto no-print">
        <div class="bg-white w-full max-w-xl rounded-2xl shadow-2xl border border-parchment-300 overflow-hidden">
            <div class="bg-royal-900 text-white px-5 py-4 flex items-center justify-between">
                <h3 class="text-lg font-bold flex items-center gap-2">
                    <i data-lucide="mail-plus" class="w-5 h-5 text-amber-300"></i>
                    הוספת דבר תורה חדש מהמייל
                </h3>
                <button onclick="closeAddModal()" class="p-1 rounded-lg hover:bg-white/10 transition cursor-pointer">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="add-lesson-form" onsubmit="handleAddLesson(event)" class="p-5 space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">חומש / קטגוריה *</label>
                        <select id="new-chumash" required onchange="updateNewParashaOptions()" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm">
                            <option value="בראשית">בראשית</option>
                            <option value="שמות">שמות</option>
                            <option value="ויקרא">ויקרא</option>
                            <option value="במדבר">במדבר</option>
                            <option value="דברים">דברים</option>
                            <option value="מועדים">מועדים</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">פרשה / מועד *</label>
                        <select id="new-parasha" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">שנה עברית *</label>
                        <input type="text" id="new-year" required placeholder="למשל: תשפ״ו" value="תשפ״ו" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">כותרת השיעור / נושא מרכזי *</label>
                    <input type="text" id="new-title" required placeholder="למשל: כוח הדיבור והשמיעה בפרשת וארא" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">פסוק פותח (אופציונלי)</label>

        // טעינת דברי תורה שהמשתמש הוסיף ושמר בדפדפן
        function loadCustomLessonsFromStorage() {
            try {

                if (Array.isArray(saved) && saved.length > 0) {
                    const existingIds = new Set(lessonsData.map(l => l.id));
                    saved.forEach(item => {
                        if (!existingIds.has(item.id)) {
                            lessonsData.unshift(item);
                        }
                    });

            } catch (e) {
                console.error('שגיאה בטעינת נתונים שמורים:', e);
            }
        }

        // מילוי תפריטי הסינון (שנים ופרשות)
        function populateFilters() {
            const yearSelect = document.getElementById('year-filter');
            const years = [...new Set(lessonsData.map(l => l.year))].sort().reverse();
            yearSelect.innerHTML = '<option value="all">כל השנים העבריות</option>';
            years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = `שנת ${y}`;
                yearSelect.appendChild(opt);
            });
            yearSelect.value = currentState.year;
            updateParashaDropdown();
        }

        function updateParashaDropdown() {
            const parashaSelect = document.getElementById('parasha-filter');
            const relevantLessons = currentState.chumash === 'all' 
                ? lessonsData 
                : lessonsData.filter(l => l.chumash === currentState.chumash);

            const availableParashot = new Set(relevantLessons.map(l => l.parasha));
            
            parashaSelect.innerHTML = '<option value="all">כל הפרשות והמועדים</option>';
            PARASHA_ORDER.forEach(p => {
                if (availableParashot.has(p.name)) {
                    const opt = document.createElement('option');
                    opt.value = p.name;
                    opt.textContent = p.chumash === 'מועדים' ? p.name : `פרשת ${p.name}`;
                    parashaSelect.appendChild(opt);
                }
            });
            parashaSelect.value = currentState.parasha;
        }

        // אתחול האפליקציה בטעינת הדף
        document.addEventListener('DOMContentLoaded', () => {

        // הגדרת מאזינים לאירועים (חיפוש, בחירות, טאבים)
        function setupEventListeners() {
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search-btn');

        // ניקוי שורת החיפוש בלחיצה על כפתור ה-X

        // הפעלת חיפוש מהיר בלחיצה על תגית (שנה, פרשה או מילת מפתח)
        function quickSearch(term) {

        // נרמול גרשיים כדי שחיפוש של תשפ"ד או תשפ״ד יעבוד בצורה זהה
        function normalizeHebrewQuotes(str) {
            return str.replace(/["״׳']/g, '"').toLowerCase();
        }

        // הדגשת מילת החיפוש בתוך הטקסט המוצג בכרטיסיות
        function highlightText(text, query) {
            if (!query || !text) return text;
            const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/["״׳']/g, '["״׳\']');
            const regex = new RegExp(`(${escaped})`, 'gi');
            return text.replace(regex, '<mark class="bg-amber-200/80 text-royal-950 rounded px-0.5 font-semibold">$1</mark>');
        }

        // קבלת אינדקס למיון לפי סדר הפרשות בתורה
        function getParashaSortIndex(parashaName) {
            const idx = PARASHA_ORDER.findIndex(p => p.name === parashaName);
            return idx === -1 ? 999 : idx;
        }

        // רינדור כרטיסיות דברי התורה בהתאם לסינון ולמיון
        function renderLessons() {
            const grid = document.getElementById('lessons-grid');
            const emptyState = document.getElementById('empty-state');
            const totalCountEl = document.getElementById('total-count');
            const filteredCountEl = document.getElementById('filtered-count');
            const favCountEl = document.getElementById('fav-count');
            const resetBtn = document.getElementById('reset-btn');
            const activeLabel = document.getElementById('active-filters-label');

            totalCountEl.textContent = lessonsData.length;
            if (favCountEl) favCountEl.textContent = favoriteIds.size;

            // סינון
            let filtered = lessonsData.filter(lesson => {
                const matchChumash = currentState.chumash === 'all' || lesson.chumash === currentState.chumash;
                const matchYear = currentState.year === 'all' || lesson.year === currentState.year;
                const matchParasha = currentState.parasha === 'all' || lesson.parasha === currentState.parasha;
                const matchFav = !currentState.onlyFavorites || favoriteIds.has(lesson.id);
                
                let matchSearch = true;
                if (currentState.search) {
                    const normalizedQuery = normalizeHebrewQuotes(currentState.search);
                    const haystack = normalizeHebrewQuotes(`${lesson.title} ${lesson.parasha} ${lesson.chumash} ${lesson.year} ${lesson.dateDisplay} ${lesson.verse} ${lesson.summary} ${lesson.content.join(' ')}`);
                    // תמיכה בחיפוש של מספר מילים (למשל: "ראה תשפ״ה" או "רמב״ן ירושלים")
                    const terms = normalizedQuery.split(/\s+/).filter(Boolean);
                    matchSearch = terms.every(term => haystack.includes(term));
                }

                return matchChumash && matchYear && matchParasha && matchFav && matchSearch;
            });

            // מיון
            filtered.sort((a, b) => {
                if (currentState.sort === 'parasha-order') {
                    const diff = getParashaSortIndex(a.parasha) - getParashaSortIndex(b.parasha);
                    if (diff !== 0) return diff;
                    return b.dateISO.localeCompare(a.dateISO);
                } else if (currentState.sort === 'date-desc') {
                    return b.dateISO.localeCompare(a.dateISO);
                } else {
                    return a.dateISO.localeCompare(b.dateISO);
                }
            });

            filteredCountEl.textContent = filtered.length;

            // הצגת כפתור איפוס ותווית סינון פעיל
            const hasFilters = currentState.chumash !== 'all' || currentState.year !== 'all' || currentState.parasha !== 'all' || currentState.search !== '' || currentState.onlyFavorites;
            resetBtn.classList.toggle('hidden', !hasFilters);

            let filterDescriptions = [];
            if (currentState.onlyFavorites) filterDescriptions.push('מועדפים בלבד');
            if (currentState.chumash !== 'all') filterDescriptions.push(`חומש ${currentState.chumash}`);
            if (currentState.parasha !== 'all') filterDescriptions.push(`פרשת ${currentState.parasha}`);
            if (currentState.year !== 'all') filterDescriptions.push(`שנת ${currentState.year}`);
            if (currentState.search) filterDescriptions.push(`חיפוש: "${currentState.search}"`);
            activeLabel.textContent = filterDescriptions.length ? `(${filterDescriptions.join(' • ')})` : '';

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(lesson => {
                const badgeClass = CHUMASH_COLORS[lesson.chumash] || 'bg-slate-100 text-slate-800 border-slate-200';
                const q = currentState.search;
                const isFav = favoriteIds.has(lesson.id);
                return `
                    <article onclick="openReaderModal('${lesson.id}')" 
                             class="lesson-card-animate group bg-white rounded-2xl border border-parchment-200 hover:border-amber-400 shadow-sm hover:shadow-md transition-all duration-200 p-5 flex flex-col justify-between cursor-pointer relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-1.5 h-full bg-royal-800 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        
                        <div>
                            <!-- תגיות חומש, פרשה, שנה וכוכב מועדפים -->
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                                <div class="flex items-center gap-1.5">
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold border ${badgeClass}">
                                        ${highlightText(lesson.chumash, q)}
                                    </span>
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-parchment-100 text-parchment-900 border border-parchment-200">
                                        ${highlightText(lesson.parasha, q)}
                                    </span>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <span class="text-xs font-bold text-amber-800 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200/70">
                                        ${highlightText(lesson.year, q)}
                                    </span>
                                    <button type="button" onclick="toggleFavorite(event, '${lesson.id}')" class="p-1 rounded-lg hover:bg-amber-50 transition cursor-pointer" title="${isFav ? 'הסר ממועדפים' : 'הוסף למועדפים'}">
                                        <i data-lucide="star" class="w-4 h-4 ${isFav ? 'fav-star-active' : 'text-slate-300 hover:text-amber-400'}"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- כותרת השיעור -->
                            <h3 class="text-lg font-bold text-slate-900 group-hover:text-royal-800 transition-colors mb-2 leading-snug font-serif">
                                ${highlightText(lesson.title, q)}
                            </h3>

                            <!-- פסוק מרכזי -->
                            ${lesson.verse ? `
                                <p class="text-xs font-serif font-semibold text-parchment-800 bg-parchment-50 px-3 py-1.5 rounded-lg border-r-2 border-amber-400 mb-3 line-clamp-1">
                                    ${highlightText(lesson.verse, q)}
                                </p>
                            ` : ''}

                            <!-- תקציר -->
                            <p class="text-sm text-slate-600 leading-relaxed line-clamp-3 mb-4">
                                ${highlightText(lesson.summary, q)}
                            </p>
                        </div>

                        <!-- פוטר כרטיסייה -->
                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                            <span class="truncate max-w-[65%]">${lesson.dateDisplay}</span>
                            <span class="text-royal-800 font-semibold flex items-center gap-1 group-hover:translate-x-[-2px] transition-transform">
                                לקריאה מלאה
                                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                            </span>
                        </div>
                    </article>
                `;
            }).join('');

            lucide.createIcons();
        }

        // ניקוי כל המסננים
        function resetFilters() {
            currentState = {
                ...currentState,
                chumash: 'all',
                year: 'all',
                parasha: 'all',
                search: '',
                onlyFavorites: false
            };
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search-btn').classList.add('hidden');
            document.getElementById('year-filter').value = 'all';
            const favBtn = document.getElementById('favorites-toggle-btn');
            if (favBtn) {
                favBtn.classList.remove('bg-amber-500', 'text-white', 'border-amber-600');
                favBtn.classList.add('bg-white', 'text-amber-800', 'border-amber-300');
            }
            
            document.querySelectorAll('.chumash-btn').forEach(b => {
                b.classList.remove('bg-royal-800', 'text-white', 'shadow-sm', 'font-semibold');
                b.classList.add('bg-white', 'text-slate-700', 'font-medium');
                if (b.dataset.chumash === 'all') {
                    b.classList.remove('bg-white', 'text-slate-700', 'font-medium');
                    b.classList.add('bg-royal-800', 'text-white', 'shadow-sm', 'font-semibold');
                }
            });

            updateParashaDropdown();
            renderLessons();
        }

        // פתיחת חלון קריאה מלאה
        let activeLesson = null;
        function openReaderModal(id) {
            const lesson = lessonsData.find(l => l.id === id);
            if (!lesson) return;
            activeLesson = lesson;

            document.getElementById('modal-chumash').textContent = `חומש ${lesson.chumash}`;
            document.getElementById('modal-parasha').textContent = `פרשת ${lesson.parasha}`;
            document.getElementById('modal-year').textContent = lesson.year;
            document.getElementById('modal-title').textContent = lesson.title;
            document.getElementById('modal-sender').textContent = lesson.sender;
            document.getElementById('modal-date').textContent = lesson.dateDisplay;

            const verseEl = document.getElementById('modal-verse');
            if (lesson.verse) {
                verseEl.textContent = lesson.verse;
                verseEl.classList.remove('hidden');
            } else {
                verseEl.classList.add('hidden');
            }

            const contentEl = document.getElementById('modal-content');
            contentEl.innerHTML = lesson.content.map(p => `<p>${p}</p>`).join('');
            contentEl.style.fontSize = `${currentState.fontSize}px`;

            // עדכון אזור ההדפסה במקביל
            document.getElementById('print-title').textContent = lesson.title;
            document.getElementById('print-meta').textContent = `חומש ${lesson.chumash} • פרשת ${lesson.parasha} • ${lesson.year}`;
            document.getElementById('print-verse').textContent = lesson.verse || '';
            document.getElementById('print-verse').classList.toggle('hidden', !lesson.verse);
            document.getElementById('print-content').innerHTML = lesson.content.map(p => `<p>${p}</p>`).join('');

            document.getElementById('reader-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeReaderModal() {
            document.getElementById('reader-modal').classList.add('hidden');
            document.body.style.overflow = '';
            activeLesson = null;
        }

        // שינוי גודל גופן בקריאה
        function changeFontSize(delta) {
            currentState.fontSize = Math.min(26, Math.max(14, currentState.fontSize + delta * 2));
            document.getElementById('modal-content').style.fontSize = `${currentState.fontSize}px`;
        }

        // העתקת דבר התורה ללוח (Clipboard)
        function copyLessonText() {
            if (!activeLesson) return;
            const fullText = `${activeLesson.title}\nפרשת ${activeLesson.parasha} (${activeLesson.year})\n${activeLesson.verse ? activeLesson.verse + '\n' : ''}\n${activeLesson.content.join('\n\n')}`;
            
            const textarea = document.createElement('textarea');
            textarea.value = fullText;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('דבר התורה הועתק ללוח בהצלחה!');
            } catch (err) {
                showToast('לא ניתן היה להעתיק אוטומטית');
            }
            document.body.removeChild(textarea);
        }

        // פתיחה וסגירה של מודאל הוספת דבר תורה
        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        // הוספת דבר תורה חדש למאגר
        function handleAddLesson(e) {
            e.preventDefault();
            const chumash = document.getElementById('new-chumash').value;
            const parasha = document.getElementById('new-parasha').value;
            const year = document.getElementById('new-year').value.trim();
            const title = document.getElementById('new-title').value.trim();
            const verse = document.getElementById('new-verse').value.trim();
            const rawContent = document.getElementById('new-content').value.trim();

            const paragraphs = rawContent.split(/\n+/).map(p => p.trim()).filter(Boolean);
            const summary = paragraphs[0] ? paragraphs[0].slice(0, 160) + (paragraphs[0].length > 160 ? '...' : '') : '';
            const today = new Date().toISOString().split('T')[0];

            const newLesson = {
                id: 'custom-' + Date.now(),
                chumash,
                parasha,
                year,
                dateISO: today,
                dateDisplay: `נוסף ידנית (${year})`,
                sender: 'סבא שאול (הוספה מהמייל)',
                title,
                verse,
                summary,
                content: paragraphs
            };

            lessonsData.unshift(newLesson);
            
            // שמירה קבועה ב-localStorage של הדפדפן
            try {
                const existingCustom = JSON.parse(localStorage.getItem(STORAGE_KEY_CUSTOM) || '[]');
                existingCustom.unshift(newLesson);
                localStorage.setItem(STORAGE_KEY_CUSTOM, JSON.stringify(existingCustom));
            } catch (err) {
                console.error('שגיאה בשמירת השיעור בדפדפן:', err);
            }

            populateFilters();
            renderLessons();
            closeAddModal();
            document.getElementById('add-lesson-form').reset();
            updateNewParashaOptions();
            showToast(`דבר התורה לפרשת ${parasha} (${year}) נשמר בארכיון!`);
        }

        // הוספה או הסרה ממועדפים
        function toggleFavorite(event, id) {
            event.stopPropagation();
            if (favoriteIds.has(id)) {
                favoriteIds.delete(id);
                showToast('הוסר מרשימת המועדפים');
            } else {
                favoriteIds.add(id);
                showToast('נוסף למועדפים לשולחן שבת');
            }
            localStorage.setItem(STORAGE_KEY_FAVS, JSON.stringify([...favoriteIds]));
            renderLessons();
        }

        // סינון לפי מועדפים בלבד
        function toggleFavoritesFilter() {
            currentState.onlyFavorites = !currentState.onlyFavorites;
            const favBtn = document.getElementById('favorites-toggle-btn');
            if (currentState.onlyFavorites) {
                favBtn.classList.remove('bg-white', 'text-amber-800', 'border-amber-300');
                favBtn.classList.add('bg-amber-500', 'text-white', 'border-amber-600');
            } else {
                favBtn.classList.remove('bg-amber-500', 'text-white', 'border-amber-600');
                favBtn.classList.add('bg-white', 'text-amber-800', 'border-amber-300');
            }
            renderLessons();
        }

        // ייצוא כל הארכיון לקובץ JSON לשיתוף או גיבוי
        function exportArchiveJSON() {
            const dataStr = JSON.stringify(lessonsData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `saba-shaul-torah-archive-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('קובץ הגיבוי הורד למחשב!');
        }

        // ייבוא מאגר מקובץ JSON
        function importArchiveJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!Array.isArray(imported)) throw new Error('פורמט קובץ לא תקין');
                    const existingIds = new Set(lessonsData.map(l => l.id));
                    const existingKeys = new Set(lessonsData.map(l => `${l.parasha}-${normalizeHebrewQuotes(l.year)}`));
                    let addedCount = 0;

                    imported.forEach(item => {
                        const key = `${item.parasha}-${normalizeHebrewQuotes(item.year)}`;
                        if (!existingIds.has(item.id) && !existingKeys.has(key)) {
                            lessonsData.push(item);
                            existingIds.add(item.id);
                            existingKeys.add(key);
                            addedCount++;
                        }
                    });

                    saveAllCustomToStorage();
                    populateFilters();
                    renderLessons();
                    showToast(`יובאו בהצלחה ${addedCount} דברי תורה חדשים!`);
                } catch (err) {
                    showToast('שגיאה בקריאת קובץ הגיבוי');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // שמירת כל השיעורים שנוספו מעבר למאגר הבסיסי ב-localStorage
        function saveAllCustomToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY_CUSTOM, JSON.stringify(lessonsData));
            } catch (err) {
                console.error('שגיאה בשמירת הארכיון בדפדפן:', err);
            }
        }

        // חילוץ פרשה, חומש ושנה עברית מתוך כותרת ותוכן פוסט מהאתר tora.hatul.info
        function parseHatulPostMetadata(rawTitle, paragraphs) {
            const fullText = `${rawTitle} ${paragraphs.slice(0, 2).join(' ')}`;
            
            // זיהוי שנה עברית (תשע"ד עד תש"צ)
            const yearMatch = fullText.match(/ה?(תש[עפצ]["״׳']?[א-ת])/);
            let year = yearMatch ? yearMatch[1].replace(/["׳']/g, '״') : 'תש״פ–תשפ״ג';
            if (year.length === 4 && !year.includes('״')) {
                year = year.slice(0, 3) + '״' + year.slice(3);
            }

            // התאמות כתיב חסר/מלא בשמות פרשות מהאתר
            const parashaAliases = {
                'תצוה': 'תצווה',
                'חקת': 'חוקת',
                'פינחס': 'פינחס',
                'פנחס': 'פינחס',
                'שפטים': 'שופטים',
                'כי תבא': 'כי תבוא',
                'נצבים': 'ניצבים - וילך',
                'ניצבים': 'ניצבים - וילך',
                'וילך': 'ניצבים - וילך',
                'אחרי': 'אחרי מות',
                'בחקתי': 'בחוקותי',
                'בחוקתי': 'בחוקותי',
                'בהעלתך': 'בהעלותך',
                'מצרע': 'מצורע'
            };

            let matchedParasha = null;
            let matchedChumash = 'מועדים';

            // בדיקה ישירה מול רשימת הפרשות המסודרת
            for (const p of PARASHA_ORDER) {
                if (rawTitle.includes(p.name)) {
                    matchedParasha = p.name;
                    matchedChumash = p.chumash;
                    break;
                }
            }

            // בדיקה מול כינויים וכתיב חסר
            if (!matchedParasha) {
                for (const [alias, canonical] of Object.entries(parashaAliases)) {
                    if (rawTitle.includes(alias)) {
                        matchedParasha = canonical;
                        const found = PARASHA_ORDER.find(item => item.name === canonical);
                        if (found) matchedChumash = found.chumash;
                        break;
                    }
                }
            }

            if (!matchedParasha) {
                matchedParasha = rawTitle.replace(/ה?תש[עפצ]["״׳']?[א-ת]/g, '').trim() || 'כללי';
            }

            return { parasha: matchedParasha, chumash: matchedChumash, year };
        }

        // שאיבה אוטומטית של כל דברי התורה מהאתר tora.hatul.info דרך WordPress REST API
        async function syncFromHatulSite() {
            const btn = document.getElementById('sync-site-btn');
            const icon = document.getElementById('sync-site-icon');
            if (btn.disabled) return;

            btn.disabled = true;
            icon.classList.add('animate-spin');
            showToast('מתחבר לאתר tora.hatul.info ושואב דברי תורה...');

            const apiBase = 'https://tora.hatul.info/wp-json/wp/v2/posts?per_page=100';
            let page = 1;
            let totalPages = 1;
            let allPosts = [];

            try {
                while (page <= totalPages && page <= 15) {
                    const targetUrl = `${apiBase}&page=${page}`;
                    let response;

                    try {
                        response = await fetch(targetUrl);
                    } catch (directErr) {
                        // גיבוי דרך פרוקסי CORS במקרה שהקובץ נפתח מקומית או מתוך מסגרת סגורה
                        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                        response = await fetch(proxyUrl);
                    }

                    if (!response || !response.ok) {
                        if (page === 1) throw new Error('לא ניתן לגשת לשרת האתר');
                        break;
                    }

                    const headerTotalPages = response.headers.get('X-WP-TotalPages');
                    if (headerTotalPages) {
                        totalPages = parseInt(headerTotalPages, 10) || 1;
                    }

                    const posts = await response.json();
                    if (!Array.isArray(posts) || posts.length === 0) break;

                    allPosts = allPosts.concat(posts);
                    if (posts.length < 100) break;
                    page++;
                }

                const parser = new DOMParser();
                const existingKeys = new Set(
                    lessonsData.map(l => `${l.parasha}-${normalizeHebrewQuotes(l.year)}`)
                );
                const existingIds = new Set(lessonsData.map(l => String(l.id)));

                let addedCount = 0;

                allPosts.forEach(post => {
                    const postId = `hatul-${post.id}`;
                    if (existingIds.has(postId)) return;

                    const titleDoc = parser.parseFromString(post.title?.rendered || '', 'text/html');
                    const cleanTitle = (titleDoc.body.textContent || '').trim();

                    const contentDoc = parser.parseFromString(post.content?.rendered || '', 'text/html');
                    const paragraphs = Array.from(contentDoc.querySelectorAll('p, li'))
                        .map(el => el.textContent.replace(/\s+/g, ' ').trim())
                        .filter(txt => txt.length > 2);

                    if (paragraphs.length === 0) return;

                    const meta = parseHatulPostMetadata(cleanTitle, paragraphs);
                    const dedupKey = `${meta.parasha}-${normalizeHebrewQuotes(meta.year)}`;
                    if (existingKeys.has(dedupKey)) return;

                    // זיהוי פסוק פותח מתוך השורות הראשונות
                    const firstVerseCandidate = paragraphs.slice(0, 3).find(p => p.includes('(') && p.includes(')') && p.length < 220) || '';
                    const bodyParagraphs = paragraphs.filter(p => !p.startsWith('ב"ה ערב שבת') && !p.startsWith('ב״ה ערב שבת'));
                    const summarySource = bodyParagraphs[0] || paragraphs[0] || '';
                    const summary = summarySource.slice(0, 175) + (summarySource.length > 175 ? '...' : '');

                    const dateISO = (post.date || '').split('T')[0] || '2021-01-01';
                    const formattedDate = dateISO.split('-').reverse().join('.');

                    lessonsData.push({
                        id: postId,
                        chumash: meta.chumash,
                        parasha: meta.parasha,
                        year: meta.year,
                        dateISO: dateISO,
                        dateDisplay: `אתר תורה • ${meta.year} (${formattedDate})`,
                        sender: 'סבא שאול (מאגר tora.hatul.info)',
                        title: `פרשת ${meta.parasha} (${meta.year}) – מתוך דברי התורה של סבא שאול`,
                        verse: firstVerseCandidate,
                        summary: summary,
                        content: paragraphs
                    });

                    existingIds.add(postId);
                    existingKeys.add(dedupKey);
                    addedCount++;
                });

                if (addedCount > 0) {
                    saveAllCustomToStorage();
                    populateFilters();
                    renderLessons();
                    showToast(`הסנכרון הושלם! נוספו ${addedCount} דברי תורה מכל השנים!`);
                } else {
                    showToast('המאגר שלך כבר מעודכן בכל דברי התורה שבאתר!');
                }
            } catch (error) {
                console.error('שגיאה בסנכרון מול tora.hatul.info:', error);
                showToast('החיבור לאתר נחסם בדפדפן זה. מומלץ לשמור את הקובץ ולפתוח ישירות.');
            } finally {
                btn.disabled = false;
                icon.classList.remove('animate-spin');
            }
        }

        // הצגת הודעת משוב מעוצבת
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
